name: Test portfolio projects
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify.py
      - run: python -m civicflow --input examples/requests.jsonl
      - run: python -m civicflow.report
      - run: python -m contractwatch examples/requests.jsonl --contract contracts/nyc311.json
      - run: python -m awsflow.demo
      - run: python infra/build_awsflow.py
      - run: git diff --exit-code -- infra/awsflow/template.json
      - run: python -m ledgerstream
      - run: python scripts/verify_demandserve_api.py
  aws-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-aws-dev.txt
      - run: python scripts/verify_aws_sdk.py
      - run: cfn-lint infra/awsflow/template.json
      - run: bash -n scripts/deploy_awsflow.sh
