name: Test portfolio projects
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify.py
      - run: python -m civicflow --input examples/requests.jsonl
      - run: python -m civicflow.report
      - run: python -m contractwatch examples/requests.jsonl --contract contracts/nyc311.json
